name: 'Release Notify Action'
description: 'Get commit data and send release notification to Mattermost with Linear and GitHub PR links formatting'
author: 'Your Name'
branding:
  icon: 'bell'
  color: 'blue'

inputs:
  tag:
    description: 'Release tag/version'
    required: true
  mattermost-url:
    description: 'Mattermost webhook URL'
    required: true
  repo-name:
    description: 'Repository display name (optional, defaults to repo name)'
    required: false
    default: ${{ github.repository }}
  registry-url:
    description: 'Container registry URL (optional)'
    required: false
    default: ''
  color:
    description: 'Color for left side of the message'
    required: false
    default: '#58FF33'
  linear-enabled:
    description: 'Enable Linear task link formatting'
    required: false
    default: 'true'
  linear-workspace:
    description: 'Linear workspace name'
    required: false
    default: 'binomtracker'
  github-pr-enabled:
    description: 'Enable GitHub PR link formatting'
    required: false
    default: 'true'
  custom-commit-title:
    description: 'Custom commit title (optional, defaults to last commit)'
    required: false
    default: ''

outputs:
  formatted-message:
    description: 'Formatted commit message'
    value: ${{ steps.format-message.outputs.message }}
  commit-title:
    description: 'Original commit title'
    value: ${{ steps.get-commit.outputs.title }}

runs:
  using: composite
  steps:
    - name: Get commit title
      id: get-commit
      shell: bash
      env:
        CUSTOM_COMMIT_TITLE: ${{ inputs.custom-commit-title }}
      run: |
        if [ -n "$CUSTOM_COMMIT_TITLE" ]; then
          COMMIT_TITLE="$CUSTOM_COMMIT_TITLE"
        else
          COMMIT_TITLE=$(git log -1 --pretty=%s)
        fi
        {
          echo "title<<EOF_COMMIT_TITLE"
          echo "$COMMIT_TITLE"
          echo "EOF_COMMIT_TITLE"
        } >> "$GITHUB_OUTPUT"
        printf '%s\n' "$COMMIT_TITLE" > /tmp/commit_title.txt

    - name: Format Linear task links
      id: format-linear
      shell: bash
      run: |
        if [ "${{ inputs.linear-enabled }}" = "true" ]; then
          FORMATTED=$(sed -E 's~#?((DEV|FEA|INT|PRT|SUP|MULT)-[0-9]+)~<https://linear.app/${{ inputs.linear-workspace }}/issue/\1|\1>~' /tmp/commit_title.txt)
        else
          FORMATTED=$(cat /tmp/commit_title.txt)
        fi
        echo "$FORMATTED" > /tmp/step1.txt
        {
          echo "message<<EOF_FORMATTED_MESSAGE"
          echo "$FORMATTED"
          echo "EOF_FORMATTED_MESSAGE"
        } >> "$GITHUB_OUTPUT"

    - name: Format GitHub PR links
      id: format-github-pr
      shell: bash
      run: |
        if [ "${{ inputs.github-pr-enabled }}" = "true" ]; then
          FORMATTED=$(sed -E 's~\(#([0-9]+)\)~<https://github.com/${{ github.repository }}/pull/\1|#\1>~' /tmp/step1.txt)
        else
          FORMATTED=$(cat /tmp/step1.txt)
        fi
        echo "$FORMATTED" > /tmp/step2.txt
        {
          echo "message<<EOF_FORMATTED_MESSAGE"
          echo "$FORMATTED"
          echo "EOF_FORMATTED_MESSAGE"
        } >> "$GITHUB_OUTPUT"

    - name: Prepare final message
      id: format-message
      shell: bash
      run: |
        FINAL_MESSAGE=$(cat /tmp/step2.txt)
        {
          echo "message<<EOF_FORMATTED_MESSAGE"
          echo "$FINAL_MESSAGE"
          echo "EOF_FORMATTED_MESSAGE"
        } >> "$GITHUB_OUTPUT"

    - name: Send notification to Mattermost
      shell: bash
      env:
        NOTIFY_TAG: ${{ inputs.tag }}
        NOTIFY_COLOR: ${{ inputs.color }}
        NOTIFY_AUTHOR: ${{ inputs.repo-name }}
        NOTIFY_REGISTRY: ${{ inputs.registry-url }}
        NOTIFY_REPO: ${{ github.repository }}
        NOTIFY_SHA: ${{ github.sha }}
        NOTIFY_URL: ${{ inputs.mattermost-url }}
      run: |
        json_escape() {
          local s=$1
          s=${s//\\/\\\\}
          s=${s//\"/\\\"}
          s=${s//$'\b'/\\b}
          s=${s//$'\f'/\\f}
          s=${s//$'\n'/\\n}
          s=${s//$'\r'/\\r}
          s=${s//$'\t'/\\t}
          printf '%s' "$s"
        }

        MESSAGE=$(cat /tmp/step2.txt)
        SHORT_SHA="${NOTIFY_SHA:0:7}"
        TEXT=$(printf 'Version: *%s*\nComment: %s' "$NOTIFY_TAG" "$MESSAGE")
        REPO_LINK="<https://github.com/${NOTIFY_REPO}|${NOTIFY_REPO}>"
        COMMIT_LINK="<https://github.com/${NOTIFY_REPO}/commit/${NOTIFY_SHA}|${SHORT_SHA}>"

        ESC_TEXT=$(json_escape "$TEXT")
        ESC_COLOR=$(json_escape "$NOTIFY_COLOR")
        ESC_AUTHOR=$(json_escape "$NOTIFY_AUTHOR")
        ESC_REPO=$(json_escape "$REPO_LINK")
        ESC_COMMIT=$(json_escape "$COMMIT_LINK")

        if [ -n "$NOTIFY_REGISTRY" ]; then
          ESC_FOOTER=$(json_escape "$NOTIFY_REGISTRY")
          JSON_PAYLOAD=$(printf '%s\n' \
            '{' \
            '  "attachments": [' \
            '    {' \
            '      "mrkdwn_in": ["text"],' \
            "      \"color\": \"${ESC_COLOR}\"," \
            "      \"author_name\": \"${ESC_AUTHOR}\"," \
            "      \"text\": \"${ESC_TEXT}\"," \
            "      \"footer\": \"${ESC_FOOTER}\"," \
            '      "fields": [' \
            '        {"title": "Repository", "value": "'"${ESC_REPO}"'", "short": true},' \
            '        {"title": "Commit", "value": "'"${ESC_COMMIT}"'", "short": true}' \
            '      ]' \
            '    }' \
            '  ]' \
            '}')
        else
          JSON_PAYLOAD=$(printf '%s\n' \
            '{' \
            '  "attachments": [' \
            '    {' \
            '      "mrkdwn_in": ["text"],' \
            "      \"color\": \"${ESC_COLOR}\"," \
            "      \"author_name\": \"${ESC_AUTHOR}\"," \
            "      \"text\": \"${ESC_TEXT}\"," \
            '      "fields": [' \
            '        {"title": "Repository", "value": "'"${ESC_REPO}"'", "short": true},' \
            '        {"title": "Commit", "value": "'"${ESC_COMMIT}"'", "short": true}' \
            '      ]' \
            '    }' \
            '  ]' \
            '}')
        fi

        if command -v jq >/dev/null 2>&1; then
          echo "$JSON_PAYLOAD" | jq .
        else
          printf '%s\n' "$JSON_PAYLOAD"
        fi

        HTTP_CODE=$(curl -sS -o /tmp/mattermost_response.txt -w '%{http_code}' \
          -X POST "$NOTIFY_URL" \
          -H 'Content-type: application/json' \
          --data "$JSON_PAYLOAD")
        cat /tmp/mattermost_response.txt
        echo
        case "$HTTP_CODE" in
          2*) ;;
          *)
            echo "Mattermost webhook failed with HTTP $HTTP_CODE"
            exit 1
            ;;
        esac

    - name: Cleanup temp files
      shell: bash
      run: |
        rm -f /tmp/commit_title.txt /tmp/step1.txt /tmp/step2.txt /tmp/mattermost_response.txt
